<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Company for inquiries, ">
    <meta name="author" content="Sisi Liu">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company logo" width="150">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>


    <main>
        <div class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com</p>
        </div>


        <section class="map-form-section">
            <div class="map">
                <h2>Our Location</h2>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3257.567834742032!2d-117.26781362432712!3d35.25804687268075!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c2c1807cc95a43%3A0x1a9131f6d80912f7!2s123%20Main%20River%20St%2C%20Kolob%2C%20CA%2092301%2C%20USA!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  width="100%" height="450" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
            <div class-="form-section">
                <h2>Get in Touch</h2>
                <div class="contact-form">

                    <form action="#" method="post">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your Name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email"
                          required>

                        <fieldset>
                            <legend>Message Purpose</legend>
                            <div class="radio-group">
                                <label><input type="radio" name="purpose" value="general"> General
                                    Inquiry</label>
                                <label><input type="radio" name="purpose" value="reservation">
                                    Reservation
                                    Question</label>
                                <label><input type="radio" name="purpose" value="suggestion">
                                    Website
                                    Suggestion</label>
                            </div>
                        </fieldset>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"
                          placeholder="Type your message here..." required></textarea>

                        <label class="checkbox">
                            <input type="checkbox" name="newsletter" checked>
                            Please subscribe me to the monthly newsletter
                        </label>

                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>
            </div>
        </section>


        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">


                <div class="employee-card">
                    <figure>
                        <img src="images/guide_1.jpg" alt="Explorer Guide">
                        <figcaption>Lead Adventure Guide</figcaption>
                    </figure>
                </div>


                <div class="employee-card">
                    <figure>
                        <img src="images/guide_2.jpg" alt="Challenge Specialist">
                        <figcaption>Safety Coordinator</figcaption>
                    </figure>
                </div>


                <div class="employee-card">
                    <figure>
                        <img src="images/guide_3.jpg" alt="Adventure Expert">
                        <figcaption>Operations Manager</figcaption>
                    </figure>
                </div>
            </div>
        </section>

    </main>


    <footer>
        <p> ©️2026 White Water Rafting | Sisi Liu</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com" target="_blank">
                <img src="images/facebook_logo.png" alt="Facebook"></a>
            <a href="https://www.youtube.com" target="_blank">
                <img src="images/youtube_logo.png" alt="Youtube"></a>
            <a href="https://www.snapchat.com" target="_blank">
                <img src="images/snapchat_logo.png" alt="Snapchat"></a>

        </nav>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Exercise</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <main>

        <h1 class="main-title">WDD 130 | HTML Form - User Poll</h1>

        <h2 class="section-title">Contact Information</h2>

        <form>
            <div class="form-group" box>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>


            <div class="form-group">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>

            <div class="form-group">
                <label for="quantity">Select Quantity</label>
                <select name="quantity" id="quantity">
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select>
            </div>

            <h2 class="section-title">Questions</h2>

            <div class="form-group" box>
                <label>What is your favorite internet browser?</label>

                <select name="browser" class="browser-select">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="Brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Do you have a household pet?</label>
                <div class="question-inline">
                    <input type="checkbox" id="pet" name="pet">
                </div>

            </div>

            <div class="form-group">
                <label for="places">List the places you have lived:</label>
                <textarea id="places" name="places" rows="4"
                  placeholder="Houston TX, U.S.A"></textarea>

            </div>

            <div class="form-group">
                <label></label>
                <button type="submit">Submit Poll</button>
            </div>

        </form>
    </main>

    <footer>
        <p>©️2026 | HTML Form - User Poll Activity | Sisi Liu</p>
    </footer>
</body>

</html>
